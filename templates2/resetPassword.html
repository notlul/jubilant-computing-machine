<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
            
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-white tracking-tight">Join Us</h1>
                <p class="text-slate-400 mt-2 text-sm">Create your account to get started</p>
            </div>

            <form action="/resetPassword" method="post" class="space-y-4">
                <div>
                    <input id="user" name="user" placeholder="Username" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                </div>
                
                <div>
                    <input id="pass" name="pass" type="password" placeholder="Password" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <input id="code" name="code" type="code" placeholder="Code" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                </div>
                <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-900/20 transition-all active:scale-[0.98]">
                    Register
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-700 pt-6">
                <a href="/login" class="text-emerald-400 hover:text-emerald-300 text-sm font-medium transition-colors">
                    Remembered your password? <span class="underline">Login here</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>

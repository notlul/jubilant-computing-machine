<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
            
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-white">Login</h1>
                <p class="text-slate-400 mt-2 text-sm">Enter your credentials to continue</p>
            </div>

            <form action="/login" method="post" class="space-y-4">
                <div>
                    <input id="user" name="user" placeholder="Username" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                </div>
                
                <div>
                    <input id="pass" name="pass" type="password" placeholder="Password" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                </div>

                <button type="submit" 
                    class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-cyan-900/20 transition-all active:scale-[0.98]">
                    Login
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-700 pt-6">
                <a href="/register" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium transition-colors">
                    New here? <span class="underline">Create an account</span>
                </a>
                <a href="/resetPassword" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium transition-colors">
                    Forgot password? <span class="underline">Forgot your password?</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>

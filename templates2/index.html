<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex flex-col min-h-screen" onload="getQuestion()">

    <div class="bg-slate-800 text-white flex justify-between items-center px-4 py-3">
        <div class="flex gap-4">
            <a href="/register" class="hover:underline text-cyan-400">Register</a>
            <a href="/login" class="hover:underline text-cyan-400">Login</a>
            <a href="/logout" class="hover:underline text-cyan-400">Logout</a>
        </div>
        <p id="displayName" class="font-bold">Nalaganje...</p>
    </div>

    <div id="question-container" class="flex flex-1 w-full">
        <button id="g1" class="flex-1 bg-red-600 text-white text-3xl font-extrabold uppercase m-0 p-0 flex items-center justify-center transition-transform active:scale-95"
            onclick="choice1()">Možnost 1</button>
        <button id="g2" class="flex-1 bg-blue-600 text-white text-3xl font-extrabold uppercase m-0 p-0 flex items-center justify-center transition-transform active:scale-95"
            onclick="choice2()">Možnost 2</button>
    </div>

    <div class="bg-slate-800 p-4 flex justify-center gap-4">
        <button class="bg-white text-black font-bold py-2 px-4 rounded-xl shadow-lg hover:bg-gray-200 transition" onclick="getQuestion()">Naslednje vprašanje</button>
        <button class="bg-white text-black font-bold py-2 px-4 rounded-xl shadow-lg hover:bg-gray-200 transition" onclick="genQuestion()">Generiraj vprašanje</button>
        <button id="create-link" class="bg-white text-black font-bold py-2 px-4 rounded-xl shadow-lg hover:bg-gray-200 transition" onclick="window.location.href='/creator'">Dodaj svoje</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>
</html>

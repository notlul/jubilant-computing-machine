<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body onload="loadPosts()">
    <h1>Posts</h1>
    <div id="posts">

    </div>


    <script>
        psts = document.getElementById("posts")
        function loadPosts(){
            $.ajax({
                url: "/getPosts",
                method: "GET",
                success: function(posts){
                    console.log(posts)
                    posts.forEach(element => {
                        psts.innerHTML += `<h2>${element.username}:</h2><p>${element.content[0]}</p><img src="${element.content[1]}">`
                    });
                },
                error: function(error){
                    console.log(error)
                }
            })
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Welcome Back</h2>
        
        <form action="/login" method="post" class="flex flex-col gap-4">
            <input id="user" name="user" placeholder="Username" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            
            <input id="pass" name="pass" type="password" placeholder="Password" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/register" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition">
                Don't have an account? Register
            </a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans" onload="setupPage()">
    
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Your account</h1>

    <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">Posts:</h2>
    <div id="posts" class="flex flex-col gap-4 mb-10">
        </div>

    <h2 class="text-xl font-semibold text-gray-700 mb-4">Create a post:</h2>
    <form method="post" action="/createPost" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md max-w-lg">
        <textarea name="text" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none mb-3" placeholder="Write something..."></textarea><br>
        <input name="image" placeholder="Image link" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none mb-4"> <br>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-200">
            Upload
        </button>
    </form>

    <script>
        const postDiv = document.getElementById("posts")
        function setupPage() {
            $.ajax({
                url: "/getUserPosts",
                method: "GET",
                success: function(posts){
                    posts.forEach(element => {
                        console.log(element)
                        // Applying Tailwind classes to the injected HTML
                        postDiv.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                            <h4 class="font-bold text-blue-600">You</h4>
                            <p class="text-gray-700 my-2">${element[0]}</p>
                            <img src="${element[1]}" class="max-w-full h-auto rounded-md shadow-sm">
                        </div>
                        `
                    });
                }
            })
        }
    </script>
</body>
</html>
